spring.application.name=ziprun-reassignment-engine
server.port=8080

# Database Configuration (H2 file-based for persistence)
spring.datasource.url=jdbc:h2:file:./data/ziprun-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never
#spring.sql.init.data-locations=classpath:data.sql

# CORS Configuration (for Angular dev server)
server.cors.allowed-origins=http://localhost:4200
server.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
server.cors.allowed-headers=*
server.cors.allow-credentials=true

# LLM Configuration
# Using Gemini 3.6 Flash (latest available, free tier)
llm.provider=gemini
llm.api-key=${LLM_API_KEY}
llm.model=gemini-3.6-flash
llm.base-url=https://generativelanguage.googleapis.com/v1/models

# Routing Configuration
# Active strategy: rule-based (fallback), ai (LLM-powered)
# Default is now AI - uses real Gemini LLM calls
routing.strategy=${ROUTING_STRATEGY:ai}

# Async Configuration (for agentic loop and AI operations off the request path)
spring.task.execution.thread-name-prefix=ziprun-
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
spring.task.scheduling.thread-name-prefix=ziprun-sched-
spring.task.scheduling.pool.size=2

# Logging
logging.level.com.ziprun=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
