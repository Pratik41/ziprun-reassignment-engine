spring.application.name=ziprun-reassignment-engine
server.port=8080

# Without SPRING_PROFILES_ACTIVE the app runs as "dev": laptop-friendly defaults (ops / ziprun).
# Docker Compose runs "prod", where ProductionSafetyCheck refuses those defaults.
spring.profiles.default=dev
# The Fleet page's phone-app simulator (a demo tool); off in prod unless DEMO_TOOLS=true
app.demo-tools=${DEMO_TOOLS:true}

# Database. Default: H2 file (data survives restarts; data/ is git-ignored).
# Docker Compose sets DATABASE_URL to PostgreSQL, e.g. jdbc:postgresql://db:5432/ziprun
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/ziprun-db}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# H2 Console (local H2 only; served behind login)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Schema is owned by Flyway migrations (db/migration), including the sample data (V2).
# Databases created before migrations existed are baselined at 0, so V1 (idempotent) runs on them too.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Routing Configuration
# Initial strategy at startup: rule-based | ai. Switch at runtime with PUT /routing/strategy.
routing.strategy=${ROUTING_STRATEGY:ai}
# (A choice made in the UI is saved in the database and wins over this default on restart.)

# Sign-in (see SecurityConfig). Change OPS_PASSWORD before exposing the app anywhere.
ops.username=${OPS_USERNAME:ops}
ops.password=${OPS_PASSWORD:ziprun}
# Shared secret for agents' phone apps: they send it as X-Agent-Token on heartbeats. Empty = only signed-in ops.
agents.app-token=${AGENT_APP_TOKEN:}
# Exact origins allowed to call the API cross-origin (the console itself uses same-origin /api). Empty = none.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# Behind nginx / the dev proxy, the client address comes from X-Forwarded-For. Without this every request
# looked like it came from the proxy, so 5 wrong passwords from anyone locked everybody out.
# Only trust it when the backend is reachable through the proxy alone (Compose binds 8080 to localhost).
server.forward-headers-strategy=framework
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Capacity: most orders (active + queued suggestions) routing gives an agent without their own limit. 0 = no limit.
agents.default-max-capacity=${AGENTS_DEFAULT_MAX_CAPACITY:6}

# Delivery deadlines: new orders are due this many minutes after creation (the New order dialog can change it).
orders.default-sla-minutes=${ORDERS_DEFAULT_SLA_MINUTES:120}
# Orders this close to their deadline (or past it) are flagged, and a faster agent is suggested if there is one.
orders.sla.at-risk-minutes=${ORDERS_SLA_AT_RISK_MINUTES:30}
orders.sla.check-interval-ms=30000

# LLM Configuration
# Providers are tried in order; transport failures (timeout, 429, HTTP error, no key) move to the next.
# If all fail, the AI strategy falls back to rule-based. Available: gemini, groq, ollama
llm.providers=${LLM_PROVIDERS:gemini,groq}
# Per-provider connect+read timeout (ms). Gemini 3.x flash typically answers in ~8s.
llm.timeout-ms=${LLM_TIMEOUT_MS:20000}
# Circuit breaker: after N failures in a row a provider is skipped for the cooldown, then one trial call
# decides whether it's back. Stops a hanging provider from adding a full timeout to every AI call.
llm.circuit.failure-threshold=${LLM_CIRCUIT_FAILURE_THRESHOLD:2}
llm.circuit.cooldown-seconds=${LLM_CIRCUIT_COOLDOWN_SECONDS:300}

# Gemini (free key: https://aistudio.google.com/app/apikey). LLM_API_KEY kept for backwards compatibility.
llm.gemini.api-key=${GEMINI_API_KEY:${LLM_API_KEY:}}
llm.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
llm.gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# Groq (free key: https://console.groq.com/keys)
llm.groq.api-key=${GROQ_API_KEY:}
llm.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
llm.groq.base-url=https://api.groq.com/openai/v1

# Ollama (local, no key)
llm.ollama.model=${OLLAMA_MODEL:llama3.1}
llm.ollama.base-url=http://localhost:11434/v1

# Heartbeats: agents whose phone app stops checking in for this long are marked OFFLINE automatically
agents.heartbeat.timeout-seconds=${AGENTS_HEARTBEAT_TIMEOUT_SECONDS:60}
agents.heartbeat.check-interval-ms=5000

# Threads (see config/AsyncConfig). Re-planning loop: a pool only grows past core-size when the
# queue is full, so core-size is what actually runs in parallel (each run may wait on the AI).
spring.task.execution.thread-name-prefix=ziprun-
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=200
# Scheduled jobs (heartbeat check, deadline check, live-update keep-alives) each get a thread
spring.task.scheduling.pool.size=3
spring.task.scheduling.thread-name-prefix=ziprun-scheduled-
# "Get suggestion" streams: one thread per open stream
streams.pool.core-size=4
streams.pool.max-size=16

# Accept lowercase enum values in JSON bodies
spring.jackson.mapper.accept-case-insensitive-enums=true

# Logging. INFO by default; LOG_LEVEL=DEBUG also prints every AI prompt and reply (don't ship that).
logging.level.com.ziprun=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
