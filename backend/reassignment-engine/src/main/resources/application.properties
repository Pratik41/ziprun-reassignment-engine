spring.application.name=ziprun-reassignment-engine
server.port=8080

# Database Configuration (H2 file-based so data survives restarts; data/ is git-ignored)
spring.datasource.url=jdbc:h2:file:./data/ziprun-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Seed data: data.sql runs after Hibernate creates the tables, and only fills an empty DB
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# Routing Configuration
# Initial strategy at startup: rule-based | ai. Switch at runtime with PUT /routing/strategy.
routing.strategy=${ROUTING_STRATEGY:ai}

# LLM Configuration
# Providers are tried in order; transport failures (timeout, 429, HTTP error, no key) move to the next.
# If all fail, the AI strategy falls back to rule-based. Available: gemini, groq, ollama, mock
llm.providers=${LLM_PROVIDERS:gemini,groq}
# Per-provider connect+read timeout (ms)
llm.timeout-ms=${LLM_TIMEOUT_MS:8000}

# Gemini (free key: https://aistudio.google.com/app/apikey). LLM_API_KEY kept for backwards compatibility.
llm.gemini.api-key=${GEMINI_API_KEY:${LLM_API_KEY:}}
llm.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
llm.gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# Groq (free key: https://console.groq.com/keys)
llm.groq.api-key=${GROQ_API_KEY:}
llm.groq.model=${GROQ_MODEL:llama-3.1-8b-instant}
llm.groq.base-url=https://api.groq.com/openai/v1

# Ollama (local, no key)
llm.ollama.model=${OLLAMA_MODEL:llama3.1}
llm.ollama.base-url=http://localhost:11434/v1

# Mock provider failure injection: none | timeout | rate-limit | garbage | hallucinate
llm.mock.fail-mode=${LLM_MOCK_FAIL_MODE:none}

# Async Configuration (for agentic loop and AI operations off the request path)
spring.task.execution.thread-name-prefix=ziprun-
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100

# Accept lowercase enum values in JSON bodies
spring.jackson.mapper.accept-case-insensitive-enums=true

# Logging
logging.level.com.ziprun=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
