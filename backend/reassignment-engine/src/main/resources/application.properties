spring.application.name=ziprun-reassignment-engine
server.port=8080

# Database Configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# CORS Configuration (for Angular dev server)
server.cors.allowed-origins=http://localhost:4200
server.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
server.cors.allowed-headers=*
server.cors.allow-credentials=true

# LLM Configuration
# Supported providers: mock, gemini, groq, ollama
#
# MOCK (recommended for local dev - no API key needed!):
#   llm.provider=mock
#
# REAL LLM (requires API key via LLM_API_KEY env var):
#   llm.provider=gemini|groq|ollama
#   llm.api-key=${LLM_API_KEY}
#
# Using MOCK by default so system works immediately without setup
llm.provider=mock
llm.api-key=${LLM_API_KEY:}
llm.model=mock-model
llm.base-url=http://localhost

# Routing Configuration
# Active strategy: rule-based, ai
# Switch at runtime via environment variable: ROUTING_STRATEGY=ai
routing.strategy=${ROUTING_STRATEGY:rule-based}

# Async Configuration (for agentic loop and AI operations off the request path)
spring.task.execution.thread-name-prefix=ziprun-
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100
spring.task.scheduling.thread-name-prefix=ziprun-sched-
spring.task.scheduling.pool.size=2

# Logging
logging.level.com.ziprun=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
