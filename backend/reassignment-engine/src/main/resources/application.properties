spring.application.name=ziprun-reassignment-engine
server.port=8080

# Database Configuration (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration (for React dev server)
server.cors.allowed-origins=http://localhost:5173,http://localhost:4200
server.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
server.cors.allowed-headers=*
server.cors.allow-credentials=true

# LLM Configuration
llm.provider=gemini
llm.api-key=${LLM_API_KEY:}
llm.model=gemini-1.5-flash
llm.base-url=https://generativelanguage.googleapis.com

# Routing Configuration
routing.strategy=rule-based

# Logging
logging.level.com.ziprun=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
