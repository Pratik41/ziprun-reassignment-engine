# One-command startup:  docker compose up --build
#   UI       -> http://localhost:4200
#   Backend  -> http://localhost:8080
# Settings go in a .env file next to this one (see .env.example).
# Without API keys, suggestions use the rule-based strategy and are labelled that way.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ziprun
      POSTGRES_USER: ziprun
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ziprun}
    volumes:
      - ziprun-pg:/var/lib/postgresql/data   # survives container restarts; `docker compose down -v` resets it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziprun -d ziprun"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend/reassignment-engine
    ports:
      # localhost only: from outside, the API is reached through the UI's nginx (/api), which sets
      # X-Forwarded-For; exposing 8080 directly would let a client fake that header
      - "127.0.0.1:8080:8080"
    environment:
      # prod: the backend refuses to start with the default password, sign-in off or the H2 console on
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/ziprun
      DATABASE_USERNAME: ziprun
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-ziprun}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ROUTING_STRATEGY: ${ROUTING_STRATEGY:-ai}
      OPS_USERNAME: ${OPS_USERNAME:-ops}
      OPS_PASSWORD: ${OPS_PASSWORD:?Set OPS_PASSWORD in .env (at least 10 characters), see .env.example}
      AGENT_APP_TOKEN: ${AGENT_APP_TOKEN:-}
      DEMO_TOOLS: ${DEMO_TOOLS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AGENTS_HEARTBEAT_TIMEOUT_SECONDS: ${AGENTS_HEARTBEAT_TIMEOUT_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend/reassignment-ui
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ziprun-pg:
