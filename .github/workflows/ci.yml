name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java 17, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/reassignment-engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Tests use an in-memory H2 DB and a test-only fake LLM: no API keys needed
      - run: mvn -B test

      # Surface failing tests as annotations (visible on the run page and via the API without signing in)
      - name: Report failed tests
        if: failure()
        run: |
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            if grep -qE '<<< (FAILURE|ERROR)!' "$f"; then
              grep -E '<<< (FAILURE|ERROR)!' -A 2 "$f" | grep -v '^--$' | while IFS= read -r line; do
                echo "::error title=$(basename "$f" .txt)::${line}"
              done
            fi
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/reassignment-engine/target/surefire-reports/

  backend-postgres:
    name: Backend on PostgreSQL (migrations + main flow)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ziprun
          POSTGRES_USER: ziprun
          POSTGRES_PASSWORD: ziprun
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ziprun -d ziprun" --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend/reassignment-engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test -Dtest=PostgresIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false
        env:
          POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/ziprun

  docker:
    name: Docker Compose (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      - name: Start the stack and check both apps answer
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            if curl -sf -u ops:ziprun localhost:8080/agents >/dev/null && curl -sf localhost:4200/queue >/dev/null; then break; fi
            sleep 3
          done
          # the API needs sign-in now; scripts use HTTP Basic (compose default ops / ziprun)
          AUTH="-u ops:ziprun"
          curl -s -o /dev/null -w "%{http_code}" localhost:8080/agents | grep -q 401
          curl -sf $AUTH localhost:8080/agents | grep -q '"AGT-001"'
          curl -sf $AUTH localhost:8080/routing/strategy
          curl -sf localhost:4200/queue | grep -q '<app-root>'
          # the UI reaches the API through nginx on its own origin
          curl -sf $AUTH localhost:4200/api/agents | grep -q '"AGT-001"'
          echo "Backend and UI are up"
      - name: Container logs
        if: always()
        run: docker compose logs --no-color | tail -80
      - if: always()
        run: docker compose down -v

  frontend:
    name: Frontend (Angular production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/reassignment-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/reassignment-ui/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production
