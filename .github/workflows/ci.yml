name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java 17, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/reassignment-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Tests use an in-memory H2 DB and a test-only fake LLM: no API keys needed
      - run: mvn -B test

  frontend:
    name: Frontend (Angular production build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/reassignment-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/reassignment-ui/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production
